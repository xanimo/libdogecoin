# codeql gh-actions file
name: CodeQL

on:
  push:
    branches:
      - '*-dev*'
      - 'main'
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'contrib/**'
      - 'doc/**'
  pull_request:
    # Deliberately wider than the push filter above: a pull request must be
    # analysed whichever branch it targets. Restricting this to '*-dev-*' meant
    # 0.1.5-dev itself never matched (no trailing dash) and neither did main, so
    # CodeQL ran on 1 pull request against CI's 42. Matches ci.yml's filter.
    branches:
      - '*'
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'contrib/**'
      - 'doc/**'

# Mirrors ci.yml: one in-flight analysis per branch or pull request, with
# releases exempt so a tag build and main always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  analyze:
    name: analyze
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'python' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]

    steps:
    - name: checkout repository
      uses: actions/checkout@v5

    - name: bound apt
      run: |
        printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "3";\nAcquire::http::Timeout "30";\n' \
          | sudo tee /etc/apt/apt.conf.d/99ci-apt > /dev/null

    - name: update system
      run: |
        sudo apt-get update --yes
        sudo apt-get install -y autoconf automake libtool-bin libevent-dev build-essential python3

    - name: Dependency cache
      uses: actions/cache@v5
      env:
        cache-name: depends
      with:
        path: ./depends/built
        key: codeql-${{ env.cache-name }}-${{ hashFiles('depends/packages/*') }}

    - name: Build depends
      run: |
        pushd depends
        make -j4 HOST=x86_64-pc-linux-gnu
        popd

    - name: init codeql
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-extended
        config-file: ./.github/codeql/codeql-config.yml

    - name: build libdogecoin
      run: |
       ./autogen.sh
       ./configure --prefix=`pwd`/depends/x86_64-pc-linux-gnu
       make check -j3 VERBOSE=1

    - name: perform codeql analysis
      uses: github/codeql-action/analyze@v4
